  # ── New MCP servers: google / github / reddit / finnhub ──────────────────────
  mcp-finnhub:
    build: { context: ., dockerfile: infra/Dockerfile.mcp }
    init: true
    command: ["python", "-m", "app.mcp.servers.finnhub_server"]
    ports: ["7005:7005"]
    env_file: .env
    restart: on-failure
    environment:
      SERVICE_NAME: mcp-finnhub
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1',7005)))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on: [postgres, redis]

  mcp-reddit:
    build: { context: ., dockerfile: infra/Dockerfile.mcp }
    init: true
    command: ["python", "-m", "app.mcp.servers.reddit_server"]
    ports: ["7006:7006"]
    env_file: .env
    restart: on-failure
    environment:
      SERVICE_NAME: mcp-reddit
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1',7006)))"]
