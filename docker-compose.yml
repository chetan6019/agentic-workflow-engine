services:
  # Build-only: produces the shared dependency image the Python services derive
  # from. Never started at runtime (build profile). Build it before the rest:
  #   docker compose build base
  base:
    build:
      context: .
      dockerfile: infra/Dockerfile.base
    image: workflow-base:latest
    profiles: ["build"]
    command: ["python", "--version"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-litellm-db.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    restart: unless-stopped
    # No container healthcheck: the qdrant image ships neither curl/wget nor a
    # health subcommand, so any in-container probe would be unreliable (a broken
    # healthcheck pinning the service "unhealthy" is worse than none). The app
    # tolerates a not-yet-ready qdrant — retrieval failures are best-effort.

  # tei:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
  #   command: ["--model-id", "BAAI/bge-base-en-v1.5", "--port", "80"]
  #   ports: ["8080:80"]
  #   volumes: ["teidata:/data"]
  #   environment:
  #     HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 60s

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./infra/litellm_config.yaml:/config.yaml:ro"]
    env_file: .env
    environment:
      # Own database — LiteLLM's Prisma sync drops unknown tables, so it MUST NOT
      # share the app's `workflow` DB (that wiped users/sessions on every restart).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/litellm
      # Isolate ALL of LiteLLM's Redis usage (response cache, router state) in db 1,
      # away from the app's db 0. This override is REQUIRED: LiteLLM reads REDIS_URL
      # from the env (.env sets db 0) in preference to cache_params, so without it the
      # proxy cache co-mingles with the app's keys in db 0. `environment` wins over
      # `env_file`, so this overrides the .env value for the proxy only.
      REDIS_URL: redis://redis:6379/1
      # DEBUG dumps full request/response blobs on every call — keep INFO unless
      # actively debugging LiteLLM internals.
      LITELLM_LOG: DEBUG
    depends_on: [postgres, redis]

