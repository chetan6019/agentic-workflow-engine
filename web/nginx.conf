server {
  listen 80;

  # API proxy: the SPA calls relative /v1 so browser and API are same-origin.
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    # SSE: never buffer the event stream; keep the connection open long enough
    # to cover a full run plus the synchronous approval resume (~180s).
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /healthz {
    proxy_pass http://api:8000;
  }

  # Hashed bundles are immutable — cache them hard.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA routing: any unknown path falls back to index.html (react-router).
  # index.html must NEVER be cached: a stale copy points at an old bundle and
  # keeps running retired code after a deploy (seen as "reload didn't log out").
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
