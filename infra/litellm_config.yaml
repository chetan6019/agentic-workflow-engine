model_list:
  # Exactly ONE deployment per model_name. With routing_strategy simple-shuffle,
  # a second same-name deployment is load-balanced (randomly picked), NOT a
  # fallback — degradation must go through router_settings.fallbacks below.

  # ---- Planner (default) ----
  - model_name: planner-default
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30

  # ---- Composer ----
  - model_name: composer
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30

  # ---- Retriever grader (low-stakes: scoring/routing → cheaper 20b) ----
  - model_name: retriever-grader
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      timeout: 20

  # ---- Guardrails judge (low-stakes: scoring → cheaper 20b) ----
  - model_name: guard-judge
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      timeout: 20

  # ---- Cross-provider fallbacks ----
  # Reached only via router_settings.fallbacks below, never in the primary
  # rotation — a Groq TPM/outage failover lands on a different provider
  # rather than another same-org, same-limit Groq deployment.
  - model_name: gemini-fallback
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 30
  - model_name: openai-fallback
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30

  # ---- Embeddings: local TEI container (no auth, no external dependency) ----
  # Note: the HF Inference Provider router requires a token with that scope,
  # which the current HF_TOKEN lacks (403). TEI is local and reliable.
  - model_name: embed
    litellm_params:
      model: huggingface/BAAI/bge-base-en-v1.5
      api_base: http://tei:80
      timeout: 30

litellm_settings:
  set_verbose: false
  drop_params: true
  num_retries: 2
  request_timeout: 60
  # Langfuse tracing must be registered here as success/failure callbacks —
  # a top-level `callbacks:` key is NOT recognized by LiteLLM.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Response caching. Same pitfall as callbacks above: this must live under
  # litellm_settings as cache/cache_params — a top-level `cache:` key is
  # silently ignored by the proxy. One flat TTL: per-model TTL maps are not
  # a supported shape. The Redis connection (and thus the db) comes from the
  # REDIS_URL env, which LiteLLM honors in preference to cache_params here — it
  # is pinned to db 1 in docker-compose.yml (litellm-proxy.environment) to keep
  # proxy entries out of the app's db 0. Do NOT rely on a `db:` cache_param: this
  # build ignores it and writes to whatever db REDIS_URL names.
  # Chat completions only — embeddings already have a 24h app-side cache in
  # app/rag/embedder.py, so proxy-caching them would just duplicate entries.
  cache: true
  cache_params:
    type: redis
    ttl: 600
    supported_call_types: ["completion", "acompletion"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 30
  # When every Groq deployment for a model_name fails (e.g. TPM rate limit),
  # fail over to a different provider — Gemini first, then OpenAI. Embeddings
  # are intentionally excluded: a different provider would change the vector
  # dimension and corrupt the Qdrant collections.
  fallbacks:
    - planner-default: ["gemini-fallback", "openai-fallback"]
    - composer: ["gemini-fallback", "openai-fallback"]
    - retriever-grader: ["gemini-fallback", "openai-fallback"]
    - guard-judge: ["gemini-fallback", "openai-fallback"]

environment_variables:
  LANGFUSE_PUBLIC_KEY: os.environ/LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY: os.environ/LANGFUSE_SECRET_KEY
  LANGFUSE_HOST: os.environ/LANGFUSE_HOST
  OPENAI_API_KEY: os.environ/OPENAI_API_KEY
  GROQ_API_KEY: os.environ/GROQ_API_KEY
  GEMINI_API_KEY: os.environ/GEMINI_API_KEY
  HF_TOKEN: os.environ/HF_TOKEN
