# Prometheus scrape config for the agentic-workflow-engine.
# Mounted read-only into the prometheus container (see docker-compose.yml).
# Targets are reached by their docker-compose SERVICE NAMES on the shared network.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # App RED metrics: workflow_run_latency_seconds, node_latency_seconds,
  # mcp_tool_latency_seconds, guardrail_block_total (FastAPI /metrics on port 8000).
  - job_name: workflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # LiteLLM proxy metrics: per-call spend + tokens (enabled via the "prometheus" callback
  # in infra/litellm_config.yaml). This is the source for LLM cost — not the app.
  # NOTE: the proxy serves metrics at "/metrics/" (trailing slash) and 307-redirects the
  # slashless path, so we scrape the slash form directly to avoid the redirect hop.
  - job_name: litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ["litellm-proxy:4000"]

  # Prometheus scraping itself, handy for sanity-checking the stack is up.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
