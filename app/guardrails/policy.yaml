# Guardrail policy — allowlist/denylist consulted by the output pipeline.
# Pure data: no code. Edited freely; loaded + cached by app/guardrails/engine.py.

# (tool, action) pairs that are hard-blocked even if the planner produces them.
# STALE (2026-06-22): empty deny-list superseded by explicit finnhub trade denies below.
# denied_tool_actions: []
  # - { tool: gmail, action: delete_forever }
# Defense-in-depth: these finnhub write/trade actions are NEVER implemented in the MCP,
# but we deny them here too so a hallucinated planner step can never reach an upstream.
denied_tool_actions:
  - { tool: finnhub, action: place_order }
  - { tool: finnhub, action: trade }
  - { tool: finnhub, action: buy }
  - { tool: finnhub, action: sell }
  - { tool: finnhub, action: square_off }

# Actions that ALWAYS require human approval before they run (destructive deletes + posts).
approval_required_actions:
  # STALE (2026-06-22): old slack/calendar namespaces superseded by google/github/reddit.
  # - calendar.delete_event
  # - slack.delete_message
  - google.delete_event
  - google.delete_email
  - github.delete_repo
  - github.delete_branch
  - github.close_pr
  - github.close_issue
  - reddit.post_comment
  - reddit.submit

# Pre-execution confidence gate: planner steps self-rated at-or-below this level pause
# for human approval BEFORE their tool runs — unless the step is a trusted read (see
# trusted_read_actions below; reads never pause on confidence alone).
#   medium = gate medium + low (default) · low = gate low only · off = disable
# (approval_required_actions above always gates regardless of this knob.)
confidence_gate_threshold: medium

# Sending mail is approval-gated only when the recipient domain is NOT allowlisted.
# STALE (2026-06-22): gmail namespace merged into the combined google MCP server.
# email_send_action: gmail.send_email
email_send_action: google.send_email
recipient_allowlist:
  - example.com
  - acme.test

# Small, configurable unsafe-content denylist; matches are redacted from responses.
# STALE (2026-06-22): subjective, low-value list retired; check_profanity is now stale.
# An empty list keeps the key valid so the engine still loads without a KeyError.
# profanity:
#   - crap
#   - darn
profanity: []

# Throttle: max successful outbound emails per user per hour before output is blocked.
max_emails_per_hour: 5

# Input rate caps (Redis counters), per user.
rate_per_minute: 30
rate_per_hour: 300

# ── Tool-specific config consumed by output_rules.check_tool_args ────────────────
# google.create_event sanity caps — an attendee/duration blow-up is usually a planner
# mistake, so block it before it reaches Calendar. deny_past_start is a flag the calendar
# tool itself honours (start-time parsing is outside the pure check_tool_args function).
google_create_event:
  max_attendees: 10
  max_duration_hours: 8
  deny_past_start: true

# Max body size (bytes) for github.create_issue / github.comment_on_pr write paths.
github_write_body:
  max_bytes: 8192

# Finnhub call-rate cap. Enforced as a Redis counter INSIDE the finnhub MCP server
# (a call-rate cap is not an output-text concern); surfaced here for visibility.
finnhub:
  rate_per_minute: 60

# Tool+action pairs whose RESPONSE skips the content-scan branch (secret/pii/hallucination)
# of the output pipeline. They still get per-user auth + Redis rate caps — only the response
# scans are skipped. Trusted because the upstream is the user's own account (github reads) or
# structured JSON from a known endpoint (finnhub). See CLAUDE.md rule #6 carve-out.
trusted_read_actions:
  - github.list_my_prs
  - github.get_pr
  - github.search_code
  - github.list_recent_commits
  - finnhub.get_quote
  - finnhub.get_company_profile
  - finnhub.get_company_news
  - finnhub.search_symbol
  - finnhub.get_basic_financials
  # Google READ tools — the user's OWN Gmail inbox + Calendar are single-user-owned data,
  # same trust basis as the github.* reads above. Without this, read-only "show my unread
  # emails" / "what's on my calendar" got spuriously gated for HITL approval by the
  # hallucination-citation scan. Writes (send_email/create_draft/create_event/update_event)
  # are deliberately NOT here. See docs/adr/0009-google-read-trusted-carveout.md.
  - google.search_email
  - google.get_thread
  - google.list_upcoming
  - google.find_free_slot
  # Reddit reads are deliberately NOT trusted — public content is untrusted by nature,
  # so the response scan stays ON for every reddit.* read.

# Tool+action WRITE pairs that have already EXECUTED by the time the OUTPUT pipeline runs
# (the orchestrator runs tools before the guard). For these the hallucination-citation scan must
# NOT flag_for_approval: the write already happened, so a HITL pause is pointless and a resume
# would re-run execute and DUPLICATE the action — the same reasoning that stopped HITL-gating
# email sends. Calendar create/update belong here (a confirmation draft cites the freshly-created
# event id, which isn't in the retrieved plan ids, and would otherwise be flagged). The clashing-
# slot case is unaffected: the orchestrator's conflict path pauses BEFORE the event is created, so
# the guard never runs for it. Email sends are covered separately via email_send_action.
executed_write_actions:
  - google.create_event
  - google.update_event
