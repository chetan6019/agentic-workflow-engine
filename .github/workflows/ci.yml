name: CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check app/ streamlit_app/ scripts/ tests/

      # R5 landed (config.py is now plain typed fields), but the rest of app/ is
      # not yet fully mypy-clean. Keep advisory until a clean `mypy app/` pass,
      # then flip to gating.
      - name: Type check (mypy, advisory)
        run: mypy app/
        continue-on-error: true

      - name: Tests (pytest)
        run: pytest -q
