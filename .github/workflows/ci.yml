# ──────────────────────────────────────────────────────────────────────────────
# CI for agentic-workflow-engine
#
# Each stage is a SEPARATE JOB so the GitHub Actions UI shows them as distinct
# checks. Job dependencies (`needs:`) enforce ordering; independent jobs run
# in parallel for speed. Bare `pip + pytest` per project convention — no
# Testcontainers in the test path. RAGAS eval lives in its own workflow
# (.github/workflows/eval-ragas.yml) so this file stays focused on the
# build/test/publish loop.
#
# Stages (left to right in the UI):
#   1. lint              — ruff check + format check
#   2. typecheck         — mypy on app/
#   3. secrets-scan      — gitleaks (find leaked keys before they ship)
#   4. unit-tests        — pytest unit suite, LLM + MCP mocked, coverage gate
#   5. integration-tests — API route tests with monkeypatched fakes (no Docker)
#   6. e2e               — happy-path flow with mocked upstreams
#   7. build-images      — Docker image per service (matrix); skips missing
#                          Dockerfiles so the workflow scales as services land
#   8. security-scan     — Trivy on each built image
#   9. publish           — push images to GHCR (main branch pushes only)
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. Individual jobs widen as needed.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}      # ghcr.io/<owner>/<repo>-<service>
  # Coverage floor. Ratchet up as the codebase matures; target is 85.
  COVERAGE_MIN: "60"

jobs:
  # ───────────────────────── 1. LINT ──────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check app/ streamlit_app/ scripts/ tests/

      - name: ruff format --check
        run: ruff format --check app/ streamlit_app/ scripts/ tests/

  # ───────────────────────── 2. TYPECHECK ─────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: mypy app/
        run: mypy app/

  # ───────────────────────── 3. SECRETS SCAN ──────────────────────────────────
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks scans full history

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── 4. UNIT TESTS ────────────────────────────────────
  unit-tests:
    name: Unit tests (+ coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx respx

      - name: Run unit tests
        env:
          # Minimal env so config.py boots; secrets unused because LLM is mocked.
          JWT_SECRET: testsecret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-not-used
        run: |
          pytest tests/ \
            --ignore=tests/api \
            --ignore=tests/e2e \
            --ignore=tests/eval \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ env.COVERAGE_MIN }} \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ───────────────────────── 5. INTEGRATION (ROUTE) TESTS ─────────────────────
  integration-tests:
    name: API route tests (httpx + monkeypatched fakes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx respx

      - name: Run API route tests
        env:
          JWT_SECRET: testsecret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-not-used
        run: pytest tests/api -q --maxfail=1

  # ───────────────────────── 6. E2E (mocked upstreams) ────────────────────────
  e2e:
    name: E2E happy path (meeting + email flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx respx

      - name: Run e2e tests (skip cleanly if none exist)
        env:
          JWT_SECRET: testsecret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-not-used
        run: |
          if [ ! -d tests/e2e ] || [ -z "$(ls -A tests/e2e 2>/dev/null)" ]; then
            echo "::notice::no e2e tests yet — skipping"
            exit 0
          fi
          pytest tests/e2e -q

  # ───────────────────────── 7. BUILD IMAGES (matrix) ─────────────────────────
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]               # build in parallel with integration/e2e
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Final MCP layer: google (Gmail + Calendar), github, reddit, finnhub.
        # If stale Dockerfiles for mcp-slack/mcp-calendar/mcp-gmail/mcp-notion
        # are still present, the per-service "skip if missing" step below
        # will quietly skip them — comment them out in compose, do not delete.
        service: [api, ui, mcp-google, mcp-github, mcp-reddit, mcp-finnhub]
    steps:
      - uses: actions/checkout@v5

      - name: Skip if Dockerfile is missing (matrix scales as services land)
        id: dockerfile
        run: |
          FILE="infra/docker/${{ matrix.service }}.Dockerfile"
          if [ ! -f "$FILE" ]; then
            echo "::notice::$FILE not present — skipping build for ${{ matrix.service }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dockerfile.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Build image (no push) and load into local docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: true                  # load so the security-scan job can read it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Save image as artifact for downstream scan
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker save "$IMAGE" -o /tmp/${{ matrix.service }}.tar

      - if: steps.dockerfile.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ───────────────────────── 8. SECURITY SCAN (Trivy) ─────────────────────────
  security-scan:
    name: Trivy scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-images]
    strategy:
      fail-fast: false
      matrix:
        # Final MCP layer: google (Gmail + Calendar), github, reddit, finnhub.
        # If stale Dockerfiles for mcp-slack/mcp-calendar/mcp-gmail/mcp-notion
        # are still present, the per-service "skip if missing" step below
        # will quietly skip them — comment them out in compose, do not delete.
        service: [api, ui, mcp-google, mcp-github, mcp-reddit, mcp-finnhub]
    steps:
      - uses: actions/checkout@v5

      - name: Check whether an image artifact was produced
        id: artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - if: steps.artifact.outcome == 'success'
        name: Load image into docker
        id: load
        run: |
          IMAGE=$(docker load -i /tmp/${{ matrix.service }}.tar | awk '/Loaded image:/ {print $3}')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - if: steps.artifact.outcome == 'success'
        name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.load.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"              # fail this job on CRITICAL/HIGH findings
          vuln-type: os,library

      - if: steps.artifact.outcome != 'success'
        run: echo "::notice::no image artifact for ${{ matrix.service }} — nothing to scan"

  # ───────────────────────── 9. PUBLISH (main only) ───────────────────────────
  publish:
    name: Publish ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration-tests, e2e, security-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Final MCP layer: google (Gmail + Calendar), github, reddit, finnhub.
        # If stale Dockerfiles for mcp-slack/mcp-calendar/mcp-gmail/mcp-notion
        # are still present, the per-service "skip if missing" step below
        # will quietly skip them — comment them out in compose, do not delete.
        service: [api, ui, mcp-google, mcp-github, mcp-reddit, mcp-finnhub]
    steps:
      - uses: actions/checkout@v5

      - name: Skip if Dockerfile is missing
        id: dockerfile
        run: |
          if [ ! -f "infra/docker/${{ matrix.service }}.Dockerfile" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.dockerfile.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Compute final tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - if: steps.dockerfile.outputs.skip == 'false'
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
