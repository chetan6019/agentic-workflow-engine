# ──────────────────────────────────────────────────────────────────────────────
# CI for agentic-workflow-engine
#
# Pipeline (jobs run in parallel unless `needs:` says otherwise):
#   lint / typecheck / secrets-scan   → tests (one pytest run, coverage gate)
#                                     → build-scan-publish (matrix: one job per
#                                       real image; Trivy scans in-job; pushes
#                                       to GHCR on main pushes only)
#
# Conventions: bare pip + pytest, no Testcontainers, all upstreams mocked.
# RAGAS eval lives in .github/workflows/eval-ragas.yml.
#
# STALE (2026-07-03): the previous 9-job pipeline (unit/integration/e2e as
# separate jobs; build→artifact→scan→publish as three matrix jobs over
# [api, ui, mcp-google, mcp-github, mcp-reddit, mcp-finnhub]) was retired here
# rather than commented in place — it referenced infra/docker/*.Dockerfile
# paths that never existed, so every image job had silently skipped since day
# one. The real Dockerfiles are infra/Dockerfile.{base,api,streamlit,mcp}; the
# four MCP servers share ONE image (Dockerfile.mcp, different commands), and
# every service image builds FROM workflow-base, which must be built first.
# Full old structure is preserved in git history (per CLAUDE.md R13 intent).
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults. Individual jobs widen as needed.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}      # ghcr.io/<owner>/<repo>-<service>
  # Coverage floor. Ratchet up as the codebase matures; target is 85.
  COVERAGE_MIN: "60"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check app/ streamlit_app/ scripts/ tests/
      - run: ruff format --check app/ streamlit_app/ scripts/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt mypy
      - run: mypy app/

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # gitleaks scans full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One pytest run covers unit, API-route, and e2e suites — they all use the
  # same mocked upstreams and the same deps, so splitting them into chained
  # jobs only tripled the install time without adding isolation.
  tests:
    name: Tests (+ coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    env:
      # Minimal env so config.py boots; secrets unused because LLM is mocked.
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      REDIS_URL: ${{ vars.REDIS_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx respx
      - name: Run test suite
        run: |
          pytest tests/ \
            --ignore=tests/eval \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ env.COVERAGE_MIN }} \
            -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Build each real image, Trivy-scan it in the same job (no artifact dance),
  # and push to GHCR only on main pushes. The four MCP servers share the "mcp"
  # image — docker-compose runs it with a different command per server.
  build-scan-publish:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [tests]
    permissions:
      contents: read
      packages: write               # only used by the main-branch push step
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infra/Dockerfile.api
          - service: streamlit
            dockerfile: infra/Dockerfile.streamlit
          - service: mcp
            dockerfile: infra/Dockerfile.mcp
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Every service image builds FROM workflow-base:latest, so build the
      # base first. The gha cache (shared scope) makes repeats near-instant.
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.base
          push: false
          load: true
          tags: workflow-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ci-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ci-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"            # fail the job on CRITICAL/HIGH findings
          vuln-type: os,library

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sha + latest tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR requires a lowercase repository path.
          IMAGE="${REGISTRY}/$(echo "${IMAGE_PREFIX}" | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}"
          docker tag "ci-${{ matrix.service }}:scan" "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker tag "ci-${{ matrix.service }}:scan" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
